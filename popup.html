<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 300px; padding: 12px; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; height: 110px; box-sizing: border-box; }
  small { color: #666; }
  button { margin-top: 8px; }
</style>
</head>
<body>
  <h3>AI Blocker</h3>
  <label><input type="checkbox" id="hideFeatures"> Hide AI features (e.g. AI Overviews)</label>
  <label><input type="checkbox" id="filterResults"> Filter blocked sites from search results</label>
  <label>Blocked domains <small>(one per line)</small>
    <textarea id="blockedDomains" placeholder="example.com"></textarea>
  </label>
  <button id="save">Save</button> <small id="status"></small>
  <script src="settings.js"></script>
  <script src="domains.js"></script>
  <script src="popup.js"></script>
</body>
</html>
