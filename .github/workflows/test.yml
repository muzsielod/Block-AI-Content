name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: node --test
      - name: Validate JSON files
        run: |
          for file in manifest.json rules.json default-blocklist.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))"
          done
